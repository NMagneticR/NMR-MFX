name: Auto-Scrape MyFXBook Calendar

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pandas

      - name: Run scraper script
        run: python test.py

      - name: Commit and push updated CSV back to repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add myfxbook_calendar.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update economic calendar CSV [skip ci]" && git push)
